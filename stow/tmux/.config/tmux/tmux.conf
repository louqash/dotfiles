# Solarized Light colors
# bg: #fdf6e3  fg: #657b83  dim: #eee8d5  green: #859900  muted: #93a1a1
set -g status-style "bg=#fdf6e3,fg=#657b83"
set -g status-left "#[bg=#859900,fg=#fdf6e3,bold] #S #[bg=#fdf6e3] "
set -g status-right "#[fg=#657b83]#{b:pane_current_path}  %d/%m %H:%M:%S "
set -g status-left-length 90

# `#{?window_zoomed_flag,...,}` appends an orange "*" only when a pane is zoomed.
# Keep the accent as a separate single-attribute #[...] tag: a comma inside one
# #[...] would be read as the conditional's branch separator and truncate the
# format. Each branch restores the segment's fg so the trailing pad is unaffected.
setw -g window-status-format "#[fg=#93a1a1] #W:#I#{?window_zoomed_flag,#[fg=#cb4b16] *#[fg=#93a1a1],} "
setw -g window-status-current-format "#[bg=#657b83,fg=#fdf6e3,bold] #W:#I#{?window_zoomed_flag,#[fg=#ffa500] *#[fg=#fdf6e3],} "

# Pane borders
set -g window-style "bg=#eee8d5"
set -g window-active-style "bg=#fdf6e3"
set -g pane-border-style "fg=#93a1a1"
set -g pane-active-border-style "fg=#859900"

unbind C-b
set-option -g prefix `
bind ` send-prefix

set -g base-index 1
setw -g pane-base-index 1

# Use zsh even when the remote account's login shell is Bash.
run-shell 'dotfiles_zsh_path=$(command -v zsh) && tmux set-option -g default-shell "$dotfiles_zsh_path"'
set -g default-command ""

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:clipboard,tmux*:clipboard,screen*:clipboard"
set -g set-clipboard on
set -as terminal-overrides ",xterm*:Tc"

set-option -g allow-rename off
set-option -g automatic-rename off
set-option -g history-limit 100000

setw -g mode-keys vi

# OSC 52 sends copied text through SSH to the client terminal's clipboard.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection-and-cancel
